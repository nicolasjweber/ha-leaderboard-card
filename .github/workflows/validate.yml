name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Verify bundle matches committed file
        run: |
          test -f ha-leaderboard-card.js
          test -f dist/ha-leaderboard-card.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: plugin
